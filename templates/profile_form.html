{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-lg p-4">

                <h2 class="text-center text-success mb-4">
                    🥗 AI Diet Profile
                </h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input type="number"
                               name="age"
                               class="form-control"
                               placeholder="Enter your age"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Gender</label>

                        <select name="gender"
                                class="form-control"
                                required>

                            <option value="">Select Gender</option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Height (cm)
                        </label>

                        <input type="number"
                               name="height"
                               class="form-control"
                               placeholder="Enter your height"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Weight (kg)
                        </label>

                        <input type="number"
                               name="weight"
                               class="form-control"
                               placeholder="Enter your weight"
                               required>
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Fitness Goal
                        </label>

                        <select name="goal"
                                class="form-control"
                                required>

                            <option value="">
                                Select Goal
                            </option>

                            <option value="Weight Loss">
                                Weight Loss
                            </option>

                            <option value="Weight Gain">
                                Weight Gain
                            </option>

                            <option value="Maintain Weight">
                                Maintain Weight
                            </option>

                        </select>

                    </div>

                    <div class="d-grid">

                        <button type="submit"
                                class="btn btn-success btn-lg">

                            🤖 Generate AI Diet Plan

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
