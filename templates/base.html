<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        AI Diet Chart Planner
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        .content{
            flex:1;
        }

        .navbar-brand{
            font-size:1.5rem;
            font-weight:bold;
        }

        footer{
            background:#212529;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:auto;
        }

        .nav-link{
            font-weight:500;
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>
<body>

<!-- Navbar Start -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand" href="/">
            🥗 AI Diet Planner
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about/">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contact/">
                        Contact
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/login/">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a href="/register/" class="btn btn-success ms-lg-2">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- Navbar End -->


<!-- Main Content -->

<div class="content">

    {% block content %}
    {% endblock %}

</div>


<!-- Footer -->

<footer>

    <div class="container">

        <p class="mb-1">
            © 2026 AI Diet Chart Planner
        </p>

        <small>
            Personalized nutrition powered by AI and Django
        </small>

    </div>

</footer>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}
{% endblock %}

</body>
</html>
